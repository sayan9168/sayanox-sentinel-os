name: 🎨 Code Quality & Formatting

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Ruff + Black (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff black

      - name: Ruff lint (non-blocking style checks only)
        run: ruff check ai-security-dashboard/backend --select E9,F63,F7,F82

      - name: Black formatting check
        run: black --check ai-security-dashboard/backend || echo "::warning::Run 'black ai-security-dashboard/backend' to format"

  frontend-lint:
    name: Prettier Check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: ai-security-dashboard/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ai-security-dashboard/frontend
        run: npm ci --no-audit --no-fund

      - name: TypeScript strict check
        working-directory: ai-security-dashboard/frontend
        run: npx tsc --noEmit

  actionlint:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
