name: 🚀 Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full test suite (release gate)
        working-directory: ai-security-dashboard
        run: |
          pip install -r backend/requirements.txt -r tests/requirements.txt
          pytest -q

      - name: Build frontend bundle
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: ai-security-dashboard/frontend/package-lock.json

      - name: npm ci && build
        working-directory: ai-security-dashboard/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Package frontend dist
        working-directory: ai-security-dashboard/frontend
        run: tar -czf /tmp/sayanox-frontend-dist.tar.gz dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: /tmp/sayanox-frontend-dist.tar.gz
