name: 🧹 Stale Issues & PRs

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "This issue has been inactive for 60 days. Marking as stale."
          stale-pr-message: "This PR has been inactive for 60 days. Marking as stale."
          exempt-issue-labels: "pinned,security,enhancement"
