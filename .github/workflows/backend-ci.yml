name: 🐍 Backend CI (FastAPI + Tests)

on:
  push:
    branches: ["main"]
    paths:
      - "ai-security-dashboard/backend/**"
      - "ai-security-dashboard/tests/**"
      - "ai-security-dashboard/pytest.ini"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            ai-security-dashboard/backend/requirements.txt
            ai-security-dashboard/tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-security-dashboard/backend/requirements.txt
          pip install -r ai-security-dashboard/tests/requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q ai-security-dashboard/backend

      - name: Run backend tests
        working-directory: ai-security-dashboard
        env:
          JWT_SECRET_KEY: ci-test-secret-key
        run: pytest -q
