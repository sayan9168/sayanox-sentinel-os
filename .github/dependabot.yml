version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/ai-security-dashboard/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/ai-security-dashboard/tests"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/ai-security-dashboard/frontend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
