version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-security-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///database/security_dashboard.db
    volumes:
      - ./database:/app/database
      - ./skills:/app/skills
    restart: unless-stopped
    networks:
      - ai-security-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-security-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - ai-security-network

networks:
  ai-security-network:
    driver: bridge
