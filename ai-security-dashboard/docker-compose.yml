version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: sayanox-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sayanox-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sayanox-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/security_dashboard.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-sayanox-super-secret-jwt-key-change-in-production-xyz789abc123}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - CLOUD_BACKUP_ENABLED=${CLOUD_BACKUP_ENABLED:-false}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - GCS_BUCKET=${GCS_BUCKET:-}
      - AZURE_CONTAINER=${AZURE_CONTAINER:-}
      - AZURE_CONNECTION_STRING=${AZURE_CONNECTION_STRING:-}
      - SFTP_HOST=${SFTP_HOST:-}
      - SFTP_USER=${SFTP_USER:-}
      - SFTP_PASSWORD=${SFTP_PASSWORD:-}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - db_data:/app/data
      - ./backup:/app/backup
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RAWIO
      - IPC_LOCK
      - NET_RAW
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    networks:
      - sayanox-network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sayanox-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    networks:
      - sayanox-network
    restart: unless-stopped

  reverse-proxy:
    image: nginx:alpine
    container_name: sayanox-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sayanox-network
    restart: unless-stopped

networks:
  sayanox-network:
    driver: bridge

volumes:
  db_data:
  redis_data:
